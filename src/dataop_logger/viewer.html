<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dataop runs</title>
<link rel="icon" href="data:,">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__'; style-src 'unsafe-inline'; img-src data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<style>
/* Layout: run list on the left, the selected run's videos and control timeline on the right. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #16191f; --ink-2: #4c5361; --ink-3: #8a91a0; --line: #e3e6eb;
  --accent: #2f5bd3; --hover: #eef2fb;
  --base: #4f7be8; --expert: #e39a2d; --blend: #8c6ad8; --none: #c4c9d2;
  --ok: #1f8a4c; --ok-bg: #e4f4ea; --bad: #c2362f; --bad-bg: #fbe9e8; --warn: #9a6a00; --warn-bg: #fbf1d9;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318; --panel: #181b21; --ink: #e8eaee; --ink-2: #b0b6c2; --ink-3: #7c8392; --line: #2a2f38;
    --accent: #7c9cf0; --hover: #1f2430;
    --base: #6b91f0; --expert: #e8a640; --blend: #a387e6; --none: #4a505b;
    --ok: #5cc98a; --ok-bg: #16301f; --bad: #f07a72; --bad-bg: #3a1c1a; --warn: #e5b94a; --warn-bg: #352b12;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; padding: 14px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header h1 span { color: var(--ink-3); font-weight: 400; font-family: var(--mono); font-size: 12px; margin-left: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 20px; }
.stat b { font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 4px; }
.stat { color: var(--ink-2); }
main { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; height: calc(100% - 52px); }
@media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } }
#list { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--panel); z-index: 1; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 999px;
  padding: 3px 10px; font: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--hover); }
.chip:focus-visible, .row:focus-visible, .ev:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11px; text-transform: uppercase;
  letter-spacing: .04em; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.row td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.row { cursor: pointer; }
.row:hover { background: var(--hover); }
.row[aria-selected="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.mini { display: flex; height: 6px; border-radius: 3px; overflow: hidden; width: 110px; background: var(--none); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.tag { color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); }
#detail { overflow: auto; padding: 18px 22px 40px; display: flex; flex-direction: column; gap: 16px; }
#detail > * { flex-shrink: 0; }
[hidden] { display: none !important; }
.title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.title h2 { margin: 0 8px 0 0; font-size: 17px; font-weight: 600; }
.task { color: var(--ink-2); }
.videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
figure { margin: 0; background: #000; border-radius: 6px; overflow: hidden; position: relative; }
figure video { display: block; width: 100%; height: 300px; object-fit: contain; background: #000; }
figcaption { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 11px; background: rgba(0,0,0,.45);
  padding: 1px 6px; border-radius: 4px; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 12px;
  font: inherit; cursor: pointer; }
.btn:hover { background: var(--hover); }
.time { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.timeline { position: relative; height: 58px; cursor: pointer; user-select: none; }
.lane { position: absolute; left: 0; right: 0; top: 0; height: 20px; }
.sg { position: absolute; top: 0; height: 20px; border-radius: 4px; font-size: 11px; line-height: 20px; padding: 0 6px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink); border: 1px solid var(--line); background: var(--panel); }
.sg.completed { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.sg.failed { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.track { position: absolute; left: 0; right: 0; top: 32px; height: 14px; border-radius: 4px; overflow: hidden; display: flex; background: var(--none); }
.track div { height: 100%; }
.mark { position: absolute; top: 28px; width: 2px; height: 22px; background: var(--ink); opacity: .55; pointer-events: none; }
.head { position: absolute; top: 0; width: 2px; height: 58px; background: var(--accent); pointer-events: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card h3 { margin: 0 0 8px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dt { color: var(--ink-3); }
dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ev { display: flex; gap: 10px; padding: 6px 4px; border-radius: 4px; cursor: pointer; }
.ev:hover { background: var(--hover); }
.fails { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.fails h3 { margin: 0 0 2px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.fm { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; cursor: pointer; padding: 4px 6px;
  border-radius: 6px; border: 1px solid transparent; background: transparent; color: inherit; font: inherit; text-align: left; }
.fm:hover { background: var(--hover); }
.fm[aria-pressed="true"] { border-color: var(--accent); background: var(--hover); }
.fm .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--bad); opacity: .7; }
.fm small { color: var(--ink-3); grid-column: 1 / -1; }
.sub { display: block; color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.empty { color: var(--ink-3); padding: 40px; text-align: center; }
.views { display: flex; gap: 6px; margin-left: auto; }
.done { color: var(--ok); font-weight: 600; }
.banner { background: var(--bg); border: 1px dashed var(--ink-3); color: var(--ink-2); padding: 8px 12px; border-radius: 6px; }
.timeline.dim .track, .timeline.dim .lane { opacity: .35; }
.ex { position: absolute; top: 28px; height: 22px; pointer-events: none; border-radius: 3px;
  background: repeating-linear-gradient(135deg, var(--ink-3) 0 2px, transparent 2px 7px); opacity: .9; }
.ex.prop { opacity: .5; outline: 1px dashed var(--ink-2); }
.hatch { background: repeating-linear-gradient(135deg, var(--ink-3) 0 2px, transparent 2px 5px) !important; }
.fs { position: absolute; top: 0; height: 58px; width: 0; border-left: 2px solid var(--bad); }
.fs.prop { border-left-style: dashed; }
.fs.pend { border-left: 2px dotted var(--accent); }
.knob { position: absolute; left: -7px; bottom: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bad);
  border: 2px solid var(--panel); cursor: ew-resize; touch-action: none; }
.fs.prop .knob { background: var(--panel); border-color: var(--bad); }
.bknob { position: absolute; top: 1px; width: 8px; height: 18px; margin-left: -4px; border-radius: 3px; background: var(--ink-2);
  cursor: ew-resize; touch-action: none; opacity: .75; }
.bknob:hover, .knob:hover { opacity: 1; transform: scale(1.15); }
.review { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; border-color: var(--accent); }
.rvsec { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-top: 4px; }
.prow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px;
  padding: 6px 8px; border-radius: 6px; background: var(--bg); }
.btns, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px;
  padding: 0 4px; margin-left: 4px; color: var(--ink-2); background: var(--panel); }
.btn.primary kbd { color: inherit; background: transparent; border-color: currentColor; }
.rvfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
.rvstatus { font-size: 12px; color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.rvstatus.bad { color: var(--bad); }
.keys { font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>
<header>
  <h1>dataop runs<span id="ds"></span></h1>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section id="list" aria-label="Runs">
    <div class="fails" id="fails" hidden></div>
    <div class="filters" id="filters"></div>
    <table>
      <thead><tr><th>Run</th><th>Outcome</th><th>Who drove</th><th id="head3">Length</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <section id="detail" aria-live="polite"><div class="empty">Select a run.</div></section>
</main>
<script src="viewer.js"></script>
</body>
</html>
