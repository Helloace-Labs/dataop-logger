<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dataop runs</title>
<link rel="icon" href="data:,">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__'; style-src 'unsafe-inline'; img-src data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<style>
/* Layout: run list on the left, the selected run's videos and control timeline on the right. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #16191f; --ink-2: #4c5361; --ink-3: #8a91a0; --line: #e3e6eb;
  --accent: #2f5bd3; --hover: #eef2fb;
  --base: #4f7be8; --expert: #e39a2d; --blend: #8c6ad8; --none: #c4c9d2;
  --lbl: #b8467f; --lbl-bg: #f8e6ef; --seg0: #b8a6e8; --seg1: #cfc2f1; --seg2: #9d86dd; --seg3: #e0d8f7; --seg-ink: #2a1d52; --ok: #1f8a4c; --ok-bg: #e4f4ea; --bad: #c2362f; --bad-bg: #fbe9e8; --warn: #9a6a00; --warn-bg: #fbf1d9;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318; --panel: #181b21; --ink: #e8eaee; --ink-2: #b0b6c2; --ink-3: #7c8392; --line: #2a2f38;
    --accent: #7c9cf0; --hover: #1f2430;
    --base: #6b91f0; --expert: #e8a640; --blend: #a387e6; --none: #4a505b;
    --lbl: #e58bb7; --lbl-bg: #3a1f2d; --seg0: #5b4a96; --seg1: #493b7d; --seg2: #6e5cb0; --seg3: #3d3268; --seg-ink: #efeaff; --ok: #5cc98a; --ok-bg: #16301f; --bad: #f07a72; --bad-bg: #3a1c1a; --warn: #e5b94a; --warn-bg: #352b12;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; padding: 14px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header h1 span { color: var(--ink-3); font-weight: 400; font-family: var(--mono); font-size: 12px; margin-left: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 20px; }
.stat b { font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 4px; }
.stat { color: var(--ink-2); }
main { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; height: calc(100% - 52px); }
@media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } }
#list { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--panel); z-index: 1; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 999px;
  padding: 3px 10px; font: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--hover); }
.chip:focus-visible, .row:focus-visible, .ev:focus-visible, .ruler:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11px; text-transform: uppercase;
  letter-spacing: .04em; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.row td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.row { cursor: pointer; }
.row:hover { background: var(--hover); }
.row[aria-selected="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.mini { display: flex; height: 6px; border-radius: 3px; overflow: hidden; width: 110px; background: var(--none); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.tag { color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); }
#detail { overflow: auto; padding: 18px 22px 40px; display: flex; flex-direction: column; gap: 16px; }
#detail > * { flex-shrink: 0; }
[hidden] { display: none !important; }
.title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.title h2 { margin: 0 8px 0 0; font-size: 17px; font-weight: 600; }
.task { color: var(--ink-2); }
.videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
figure { margin: 0; background: #000; border-radius: 6px; overflow: hidden; position: relative; }
figure video { display: block; width: 100%; height: 300px; object-fit: contain; background: #000; }
figcaption { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 11px; background: rgba(0,0,0,.45);
  padding: 1px 6px; border-radius: 4px; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 12px;
  font: inherit; cursor: pointer; }
.btn:hover { background: var(--hover); }
.time { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.timeline { position: relative; height: calc(98px + 20px * var(--pinrows, 1)); cursor: pointer; user-select: none; }
.lane { position: absolute; left: 0; right: 0; top: 24px; height: 20px; }
.sg { position: absolute; top: 0; height: 20px; border-radius: 3px; font-size: 11px; line-height: 20px; overflow: hidden;
  white-space: nowrap; color: var(--seg-ink); box-shadow: inset -1px 0 0 var(--panel); cursor: default; }
.sg span { padding: 0 6px; }
.sg.shade0 { background: var(--seg0); } .sg.shade1 { background: var(--seg1); }
.sg.shade2 { background: var(--seg2); } .sg.shade3 { background: var(--seg3); }
.sg:hover, .sg.hl { overflow: visible; z-index: 6; filter: brightness(1.25) saturate(1.2); box-shadow: 0 0 0 2px var(--accent); }
.sg:hover span, .sg.hl span { position: relative; z-index: 6; background: inherit; border-radius: 3px; padding: 0 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.track { position: absolute; left: 0; right: 0; top: 56px; height: 14px; border-radius: 4px; overflow: hidden; display: flex; background: var(--none); }
.track div { height: 100%; }
.pins { position: absolute; left: 0; right: 0; top: 77px; height: calc(20px * var(--pinrows, 1)); }
.pin { position: absolute; top: 0; transform: translateX(-50%); width: 20px; height: 18px; padding: 0; border-radius: 9px;
  font: 600 10px/16px var(--sans); color: var(--panel); background: var(--ink-2); border: 1px solid var(--panel); cursor: pointer; z-index: 4; overflow: visible; }
.pin::before { content: ""; position: absolute; left: 50%; top: calc(-6px - 20px * var(--row, 0)); width: 1px; height: calc(6px + 20px * var(--row, 0)); background: inherit; }
.pin.ok { background: var(--ok); } .pin.bad { background: var(--bad); } .pin.warn { background: var(--expert); }
.pin.attn { background: var(--warn); } .pin.lbl { background: var(--lbl); } .pin.muted { background: var(--ink-3); }
.pin.hl, .pin:hover, .pin:focus-visible { box-shadow: 0 0 0 2px var(--accent); z-index: 5; outline: none; }
.head { position: absolute; top: 0; width: 2px; height: calc(96px + 20px * var(--pinrows, 1)); margin-left: -1px; background: var(--ink); opacity: .85; pointer-events: none; z-index: 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card h3 { margin: 0 0 8px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dt { color: var(--ink-3); }
dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ev { display: flex; gap: 10px; padding: 6px 4px; border-radius: 4px; cursor: pointer; }
.ev:hover { background: var(--hover); }
.fails { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.fails h3 { margin: 0 0 2px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.fm { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; cursor: pointer; padding: 4px 6px;
  border-radius: 6px; border: 1px solid transparent; background: transparent; color: inherit; font: inherit; text-align: left; }
.fm:hover { background: var(--hover); }
.fm[aria-pressed="true"] { border-color: var(--accent); background: var(--hover); }
.fm .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--bad); opacity: .7; }
.fm small { color: var(--ink-3); grid-column: 1 / -1; }
.sub { display: block; color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.empty { color: var(--ink-3); padding: 40px; text-align: center; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.undobtn { margin-left: auto; }
.undobtn + .editbtn, .editbtn:first-child { margin-left: 0; }
.editbtn { margin-left: auto; }
.timeline.editing { cursor: crosshair; }
.lblane { position: absolute; left: 0; right: 0; top: 0; height: 18px; z-index: 3; pointer-events: none; }
.lblane .lb { pointer-events: auto; }
.lb { position: absolute; top: 0; height: 18px; border-radius: 4px; font-size: 11px; line-height: 18px; padding: 0 6px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; background: var(--lbl-bg); color: var(--lbl); border: 1px solid var(--lbl); cursor: pointer; }
.lb.out { background: repeating-linear-gradient(135deg, var(--lbl-bg) 0 4px, var(--panel) 4px 8px); }
.lb.on { box-shadow: 0 0 0 2px var(--accent); }
.selbox { position: absolute; top: 0; height: 76px; border-radius: 4px; cursor: grab; touch-action: none; z-index: 2;
  background: color-mix(in srgb, var(--accent) 18%, transparent); outline: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.selbox:active { cursor: grabbing; }
.selbox.fixed { pointer-events: none; cursor: default; }
.ruler { position: absolute; left: 0; right: 0; top: calc(80px + 20px * var(--pinrows, 1)); height: 16px; border-radius: 3px; cursor: ew-resize; touch-action: none;
  background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%), var(--bg); }
.knob { position: absolute; left: -6px; bottom: -2px; width: 0; height: 0; border-left: 7px solid transparent;
  border-right: 7px solid transparent; border-bottom: 10px solid var(--ink); pointer-events: auto; cursor: ew-resize; }
.hdl { position: absolute; top: 20px; width: 16px; height: 56px; cursor: ew-resize; }
.hdl.l { left: -8px; } .hdl.r { right: -8px; }
.hdl::after { content: ""; position: absolute; left: 7px; top: 4px; width: 2px; height: 32px; border-radius: 1px; background: var(--accent); }
.hint { color: var(--ink-3); font-size: 12px; }
.lbcount { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; font-size: 10px; text-align: center;
  background: var(--lbl-bg); color: var(--lbl); vertical-align: 1px; }
.lbpanel { display: flex; flex-direction: column; gap: 8px; border-color: var(--accent); max-width: 760px; }
.lbspan { font-variant-numeric: tabular-nums; font-weight: 600; }
.lbspan .sub { display: inline; font-weight: 400; margin-left: 6px; }
.lbq { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.lbrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lbrow .lbq { min-width: 92px; }
textarea, .segin { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { width: 100%; resize: vertical; }
.segin { width: 130px; padding: 3px 8px; }
.interp { font-size: 12px; color: var(--ink-2); background: var(--bg); padding: 6px 8px; border-radius: 6px; }
.lbfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lbstatus { font-size: 12px; color: var(--ink-3); }
.lbstatus.bad { color: var(--bad); }
.about { grid-column: span 1; }
.major { grid-column: span 2; }
.major .ev { align-items: baseline; }
.major .attn { background: var(--warn-bg); border-radius: 6px; }
.major .muted { color: var(--ink-3); }
.attnspan { position: absolute; top: 50px; height: 26px; border-radius: 3px; pointer-events: none; background: var(--warn); opacity: .22; }
.num-badge { flex: none; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; font: 600 10px/18px var(--sans);
  text-align: center; color: var(--panel); background: var(--ink-2); align-self: center; }
.major .ok .num-badge { background: var(--ok); } .major .bad .num-badge { background: var(--bad); }
.major .warn .num-badge { background: var(--expert); } .major .attn .num-badge { background: var(--warn); }
.major .lbl .num-badge { background: var(--lbl); } .major .muted .num-badge { background: var(--ink-3); }
.major .pol .num-badge, .pin.pol { background: var(--base); }
.major .seg .num-badge, .pin.seg { background: var(--seg2); color: var(--seg-ink); }
.major .evt { font-weight: 500; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.cardhead h3 { margin: 0; }
.aihelp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 10px; margin-bottom: 8px; border-radius: 6px; background: var(--bg); }
.aihelp code { flex-basis: 100%; font-family: var(--mono); font-size: 11px; white-space: pre-wrap; color: var(--ink-2); }
.major .note { cursor: text; } .major .note:hover { color: var(--ink-2); }
.major .note.add { cursor: pointer; opacity: .7; }
.noteedit { display: flex; gap: 6px; margin-top: 4px; }
.noteedit input { flex: 1; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.major .ev.hl { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
@media (max-width: 860px) { .about, .major { grid-column: auto; } }
.about h3.sub2 { margin: 12px 0 6px; }
.about .checks { margin: 0; padding-left: 18px; color: var(--ink-2); }
.about .ids { margin-top: 12px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.sub.inl { display: inline; font-family: var(--mono); }
.banner { border: 1px dashed var(--ink-3); color: var(--ink-2); padding: 8px 12px; border-radius: 6px; }
.banner.bad { border-color: var(--bad); color: var(--bad); }
.aibar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn.ai { border-color: var(--lbl); color: var(--lbl); }
.cut { position: absolute; top: 54px; z-index: 3; height: 18px; border-radius: 3px; cursor: pointer;
  background: repeating-linear-gradient(135deg, var(--ink-2) 0 2px, transparent 2px 6px), var(--bg); opacity: .85; }
.cut.on { box-shadow: 0 0 0 2px var(--accent); }
.sugg-span { position: absolute; top: 52px; height: 22px; border-radius: 3px; background: var(--ink-3); opacity: .35;
  outline: 1px dashed var(--ink-2); pointer-events: none; }
.hatch { background: repeating-linear-gradient(135deg, var(--ink-2) 0 2px, transparent 2px 5px) !important; }
.sugsw { background: var(--ink-3) !important; opacity: .5; }
.legend i.sg { position: static; display: inline-block; width: 10px; height: 10px; border-radius: 2px; box-shadow: none; margin-right: 5px; vertical-align: -1px; }
.seglegend.first { margin-left: 6px; padding-left: 14px; border-left: 1px solid var(--line); }
.sugg { display: flex; flex-direction: column; gap: 6px; max-width: 860px; }
.srow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 5px 0; border-top: 1px solid var(--line); }
.srow:first-of-type { border-top: 0; }
.sdesc { flex: 1 1 260px; }
.sdesc .sub { display: inline; margin-left: 6px; }
.sbtns { display: flex; gap: 6px; }
</style>
</head>
<body>
<header>
  <h1>dataop runs<span id="ds"></span></h1>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section id="list" aria-label="Runs">
    <div class="fails" id="fails" hidden></div>
    <div class="filters" id="filters"></div>
    <table>
      <thead><tr><th>Run</th><th>Outcome</th><th>Who drove</th><th id="head3">Length</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <section id="detail" aria-live="polite"><div class="empty">Select a run.</div></section>
</main>
<script src="viewer.js"></script>
</body>
</html>
