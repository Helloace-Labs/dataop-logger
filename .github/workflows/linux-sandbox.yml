# Runs the logger suite on Linux with bubblewrap, so the Linux hook sandbox (linux-bwrap) is proven for real:
# the hostile-hook tests run inside it and may not skip. No secrets; read-only token.
name: linux sandbox

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Python outside the home folder (the sandbox refuses an interpreter inside or above home)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          bwrap --version
      - name: Install the logger's test dependencies
        run: python -m pip install numpy pyarrow pytest
      - name: Show the runtime the sandbox will see
        run: |
          python -c "import sys, numpy; print(sys.executable, numpy.__file__)"
          ls -ld /lib64 /lib
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>/dev/null || true
      - name: Hook sandbox tests (sandbox required)
        env:
          AFTERSHOCK_REQUIRE_HOOK_SANDBOX: "1"
        run: python -m pytest -v -rs tests/test_hook_sandbox.py
      - name: Full logger suite
        env:
          AFTERSHOCK_REQUIRE_HOOK_SANDBOX: "1"
        run: python -m pytest -q -rs
